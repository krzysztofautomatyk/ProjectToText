# cargo-deny configuration for ProjectToText (`ptt`)
# Enforces license allowlist, dependency source restrictions, and RustSec advisory policy in CI.

[graph]
all-features = false

[advisories]
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
ignore = [
    # Informational warnings from the Linux GTK 3 stack pulled in by Tauri v2 (documented in SECURITY.md):
    "RUSTSEC-2024-0370", # proc-macro-error (unmaintained, via gtk3-macros)
    "RUSTSEC-2024-0429", # glib (unsound variant_str_iter, unused by ptt)
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
