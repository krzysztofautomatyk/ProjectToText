name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --ci --no-sign --target aarch64-apple-darwin
          - platform: macos-latest
            args: --ci --no-sign --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: --ci --no-sign
          - platform: windows-latest
            args: --ci --no-sign

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: npm --prefix ui ci

      - name: Read app version
        id: app_version
        shell: bash
        run: echo "version=$(sed -n 's/^version = \"\(.*\)\"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.app_version.outputs.version) }}
          releaseName: ProjectToText ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-dev', steps.app_version.outputs.version) }}
          releaseBody: "Download the macOS .dmg or Windows .msi/.exe installer from the assets. Use: ptt pack . -o context.xml"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
