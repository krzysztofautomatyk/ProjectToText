name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # One platform at a time: each job merges its entry into the shared latest.json,
      # and parallel jobs overwrote each other (darwin-x86_64 went missing).
      max-parallel: 1
      matrix:
        include:
          # Apple Silicon (M1 and newer).
          - platform: macos-latest
            args: --ci --target aarch64-apple-darwin
            asset_pattern: ptt-[version]-macos-apple-silicon[ext]
          - platform: macos-latest
            args: --ci --target x86_64-apple-darwin
            asset_pattern: ptt-[version]-macos-intel[ext]
          - platform: ubuntu-22.04
            args: --ci
            asset_pattern: ptt-[version]-linux-x64[ext]
          - platform: windows-latest
            args: --ci
            asset_pattern: ptt-[version]-windows-x64[setup][ext]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: npm --prefix ui ci

      - name: Read app version
        id: app_version
        shell: bash
        run: echo "version=$(sed -n 's/^version = \"\(.*\)\"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (separate from OS code signing; no OS certificates are configured, so that step is skipped).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.app_version.outputs.version) }}
          releaseName: ProjectToText ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-dev', steps.app_version.outputs.version) }}
          releaseBody: "Pick the file for your system: macOS Apple Silicon (M1 and newer) .dmg, macOS Intel .dmg, Windows .msi/.exe, or Linux .AppImage/.deb/.rpm. Use: ptt pack . -o context.xml"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          releaseAssetNamePattern: ${{ matrix.asset_pattern }}

  # tauri-action merges each platform into latest.json from parallel jobs, which can race.
  # Fail the release if any platform is missing so auto-update never silently skips users.
  verify-updater-manifest:
    needs: publish-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Check latest.json lists every platform
        shell: bash
        run: |
          set -euo pipefail
          json=$(curl -fsSL "https://github.com/${{ github.repository }}/releases/latest/download/latest.json")
          echo "$json" | jq -r '.version'
          for key in darwin-aarch64 darwin-x86_64 linux-x86_64 windows-x86_64; do
            echo "$json" | jq -e --arg k "$key" '.platforms[$k].url and .platforms[$k].signature' > /dev/null \
              || { echo "latest.json is missing platform: $key"; exit 1; }
          done
