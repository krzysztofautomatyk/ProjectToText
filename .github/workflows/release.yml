name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # One platform at a time: each job merges its entry into the shared latest.json,
      # and parallel jobs overwrote each other (darwin-x86_64 went missing).
      max-parallel: 1
      matrix:
        include:
          # Apple Silicon (M1 and newer).
          - platform: macos-latest
            args: --ci --target aarch64-apple-darwin
            asset_pattern: ptt-[version]-macos-apple-silicon[ext]
          - platform: macos-latest
            args: --ci --target x86_64-apple-darwin
            asset_pattern: ptt-[version]-macos-intel[ext]
          - platform: ubuntu-22.04
            args: --ci
            asset_pattern: ptt-[version]-linux-x64[ext]
          - platform: windows-latest
            args: --ci
            asset_pattern: ptt-[version]-windows-x64[setup][ext]

    runs-on: ${{ matrix.platform }}
    steps:
      -        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: npm --prefix ui ci

      - name: Read app version
        id: app_version
        shell: bash
        run: echo "version=$(sed -n 's/^version = \"\(.*\)\"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (separate from OS code signing; no OS certificates are configured, so that step is skipped).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.app_version.outputs.version) }}
          releaseName: ProjectToText ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-dev', steps.app_version.outputs.version) }}
          releaseBody: "Pick the file for your system: macOS Apple Silicon (M1 and newer) .dmg, macOS Intel .dmg, Windows .msi/.exe, or Linux .AppImage/.deb/.rpm. Use: ptt pack . -o context.xml\n\n**macOS: 'Apple cannot verify ptt.app' warning.** The app is not notarized yet, so Gatekeeper blocks the first launch. Click Done (not Move to Bin), then open System Settings > Privacy & Security, scroll down and click Open Anyway next to ptt.app (available for about an hour). Or run: xattr -dr com.apple.quarantine /Applications/ptt.app"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          releaseAssetNamePattern: ${{ matrix.asset_pattern }}

  # tauri-action merges each platform into latest.json from parallel jobs, which can race.
  # Fail the release if any platform is missing so auto-update never silently skips users.
  # tauri-action also writes API asset URLs (api.github.com/.../releases/assets/ID). The updater
  # does a plain GET, which returns JSON for those, so rewrite them to public download links.
  verify-updater-manifest:
    needs: publish-tauri
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      -        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read app version
        id: app_version
        shell: bash
        run: echo "tag=v$(sed -n 's/^version = \"\(.*\)\"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Check every platform installer and its signature are attached
        shell: bash
        env:
          TAG: ${{ steps.app_version.outputs.tag }}
        run: |
          set -euo pipefail
          names=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')
          for platform in macos-apple-silicon macos-intel linux-x64 windows-x64; do
            installer=$(echo "$names" | grep "$platform" | grep -v '\.sig$' | head -n 1 || true)
            if [ -z "$installer" ]; then
              echo "release $TAG is missing the $platform installer"
              exit 1
            fi
            echo "$names" | grep -qxF "$installer.sig" \
              || { echo "release $TAG has no updater signature for $installer"; exit 1; }
            echo "ok: $installer (+ .sig)"
          done

      - name: Rewrite latest.json URLs to public download links
        shell: bash
        env:
          TAG: ${{ steps.app_version.outputs.tag }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          gh release download "$TAG" --repo "$REPO" --pattern latest.json --dir "$work" --clobber
          # Map each API asset URL to the name of the file it points at.
          map='{}'
          while read -r url; do
            endpoint=${url#https://api.github.com/}
            name=$(gh api "$endpoint" --jq .name)
            map=$(jq -c --arg u "$url" --arg n "$name" '. + {($u): $n}' <<< "$map")
          done < <(jq -r '[.platforms[].url | select(startswith("https://api.github.com/"))] | unique | .[]' "$work/latest.json")
          jq --arg base "https://github.com/$REPO/releases/download/$TAG/" --argjson map "$map" \
            '.platforms |= map_values(.url |= (if startswith("https://api.github.com/") then $base + $map[.] else . end))' "$work/latest.json" > "$work/rewritten.json"
          mv "$work/rewritten.json" "$work/latest.json"
          gh release upload "$TAG" "$work/latest.json" --repo "$REPO" --clobber

      - name: Check latest.json lists every platform
        shell: bash
        run: |
          set -euo pipefail
          json=$(curl -fsSL "https://github.com/${REPO}/releases/latest/download/latest.json")
          echo "$json" | jq -r '.version'
          for key in darwin-aarch64 darwin-x86_64 linux-x86_64 windows-x86_64; do
            echo "$json" | jq -e --arg k "$key" '.platforms[$k].url and .platforms[$k].signature' > /dev/null \
              || { echo "latest.json is missing platform: $key"; exit 1; }
            echo "$json" | jq -e --arg k "$key" '.platforms[$k].url | startswith("https://github.com/")' > /dev/null \
              || { echo "latest.json URL for $key is not a download link"; exit 1; }
          done

      - name: Install cargo-cyclonedx and attach CycloneDX SBOM to release
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-cyclonedx

      - name: Generate and upload CycloneDX SBOM
        shell: bash
        env:
          TAG: ${{ steps.app_version.outputs.tag }}
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --override-filename ptt-sbom
          test -s ptt-sbom.cdx.json
          gh release upload "$TAG" ptt-sbom.cdx.json --repo "$REPO" --clobber
